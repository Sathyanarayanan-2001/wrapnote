name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages rights.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Built-in Word template check (roles, fonts, fields, table rules)
        run: npm run template:check
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python -m http.server 8765 --directory dist > /dev/null 2>&1 &
          sleep 2
          python tests/e2e/run_e2e.py --round ci
          python tests/e2e/run_issues.py --round ci
          python tests/e2e/run_issues_v120.py --round ci
          python tests/e2e/run_refs_v130.py --round ci
          python tests/e2e/characterise_v140.py
          python tests/e2e/run_v140.py --round ci
          python tests/e2e/links.py
          python tests/e2e/usability.py
          python tests/e2e/usability_v110.py
          python tests/e2e/usability_v120.py
          python tests/e2e/usability_v130.py
          python tests/e2e/usability_v140.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
